spring.application.name=postfolio

# Local PostgreSQL (locked decision - no H2 at runtime). Override via env for other setups.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postfolio}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postfolio}
spring.datasource.driver-class-name=org.postgresql.Driver

# Demo-friendly schema management; switch to migrations before any real deploy.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
