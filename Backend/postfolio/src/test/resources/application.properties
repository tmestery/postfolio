# Tests run against in-memory H2 so CI needs no database service.
# The runtime app uses PostgreSQL only (see main application.properties).
spring.datasource.url=jdbc:h2:mem:postfolio-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
