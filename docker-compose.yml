# Postfolio local stack
#
# Quick start:
#   cp .env.example .env          # fill GROQ_API_KEY + FINNHUB_API_KEY
#   docker compose up --build
#
# Services:
#   postgres  → localhost:5432
#   backend   → localhost:8080
#   frontend  → localhost:5173
#
# Postgres-only (run Spring/Vite on the host):
#   docker compose up -d postgres

name: postfolio

services:
  postgres:
    image: postgres:16-alpine
    container_name: postfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postfolio}
      POSTGRES_USER: ${POSTGRES_USER:-postfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postfolio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postfolio} -d ${POSTGRES_DB:-postfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: postfolio-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network, point at the postgres service name.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postfolio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postfolio}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postfolio}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      GROQ_MODEL_FAST: ${GROQ_MODEL_FAST:-llama-3.1-8b-instant}
      GROQ_MODEL_JUDGE: ${GROQ_MODEL_JUDGE:-llama-3.3-70b-versatile}
      AGENT_ALLOWANCE: ${AGENT_ALLOWANCE:-1000}
      AGENT_CASH_RESERVE_PCT: ${AGENT_CASH_RESERVE_PCT:-0.15}
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-60000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: postfolio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:8080}
      VITE_CLIENT_URL: ${VITE_CLIENT_URL:-http://localhost:5173}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Hot-reload source; keep container node_modules.
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postfolio_pg_data:
  frontend_node_modules:
